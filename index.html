<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>study-sprint-board</title>
    <link href="/src/style.css" rel="stylesheet">
  </head>
  <body class="bg-slate-100 text-slate-800 fot-sans min-h-screen p-6">
   <header class="max-w-6xl mx-auto mb-8 bg-white p-6 roumded-2xl shadow-sm">
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
  <div>
<h1 class="tet-2xl fontbold text-indigo-700">
🗂️ برد برنامه‌ریزی مطالعه
</h1>
<p class="text-slate-500 text-sm mt-1">
مدیریت کارهای مطالعاتی و تسک‌ها
</p>
</div>
<div class="flex items-center gap-4 bg-indigo-50 p-4 rounded-xl text-indigo-900 text-sm font-semibold ">
  <div>کل کارها: <span id="total-count" class="font-bold text-indigo-600">0</span></div>
        <div class="h-4 w-px bg-indigo-200"></div>
<div>درصد پیشرفت: <span id="progress-percent">0%</span></div>
      </div>
</div>

<!-- جست و جو و فیلتر -->
<div class="flex flex-col md:flex-row gap-4">
  <input type="text" id="search-input" placeholder="🔍 جستجو در عنوان یا موضوع..." class="flex-1 p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
<select  id="priority-filter" class="p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
<option value="high">اولویت بالا 🔥</option>
        <option value="medium">اولویت متوسط ⚡</option>
       <option value="low">اولویت پایین 🌱</option>
</select>
</div>
   </header>


   <!-- فرم افزودن تسک جدید -->
<form id="add-task-form" class="bg-white p-5 rounded-2xl shadow-sm mb-6 border border-slate-100 flex flex-col md:flex-row gap-4 items-end">
  
  <!-- عنوان تسک -->
  <div class="flex-1 w-full">
    <label for="task-title" class="block text-xs font-semibold text-slate-600 mb-1">عنوان کار *</label>
    <input type="text" id="task-title" placeholder="مثلاً: تمرین توابع جاوااسکریپت" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
  </div>

  <!-- موضوع -->
  <div class="w-full md:w-48">
    <label for="task-subject" class="block text-xs font-semibold text-slate-600 mb-1">موضوع *</label>
    <input type="text" id="task-subject" placeholder="مثلاً: جاوااسکریپت" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
  </div>

  <!-- اولویت -->
  <div class="w-full md:w-40">
    <label for="task-priority" class="block text-xs font-semibold text-slate-600 mb-1">اولویت</label>
    <select id="task-priority" class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
      <option value="low">پایین 🌱</option>
      <option value="medium" selected>متوسط ⚡</option>
      <option value="high">بالا 🔥</option>
    </select>
  </div>

  <!-- دکمه ثبت -->
  <button type="submit" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition-colors cursor-pointer">
    ➕ افزودن کار
  </button>
</form>

<!-- پیام خطای اعتبارسنجی -->
<div id="form-error" class="hidden mb-6 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-xl"></div>

   <!-- ستون ها -->
   <main class="max-w-6xl max-auto grid grid-cols-1 md:grid-cols-3 gap-6">

<!-- ستون 1 -->
<section class="bg-slate-200/60 p-4 rounded-2xl flex flex-col gap-4">
<h2 class="font-bold text-slate-700 flex items-center justify-between">
        <span>📌 برای انجام (To Do)</span>
        <span id="todo-count" class="bg-slate-300 text-slate-700 px-2.5 py-0.5 rounded-full text-xs">0</span>
      </h2>
      <div id="todo-list" class="flex flex-col gap-3 min-h[150px]"></div>
</section>

<!-- ستون2 در حال انجام  -->

<section class="bg-slate-100/60 p-4 rounded-2xl flex flex-col gap-4">
<h2 class="font-bold text-slate-800 flex items-center justify-between">
        <span>⏳ در حال انجام (In Progress)</span>
        <span id="inprogress-count" class="bg-slate-300 text-slate-800 px-2.5 py-0.5 rounded-full text-xs">0</span>
      </h2>
      <div id="inprogress-list" class="flex flex-col gap-3 min-h[150px]"></div>
</section>

<!-- ستون ۳: انجام‌شده -->
    <section class="bg-emerald-100/60 p-4 rounded-2xl flex flex-col gap-4">
      <h2 class="font-bold text-emerald-800 flex items-center justify-between">
        <span>✅ انجام‌شده (Done)</span>
        <span id="done-count" class="bg-emerald-200 text-emerald-800 px-2.5 py-0.5 rounded-full text-xs">0</span>
      </h2>
      <div id="done-list" class="flex flex-col gap-3 min-h-[150px]"></div>
    </section>


   </main>
   
   
   
   
   
   
   
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
